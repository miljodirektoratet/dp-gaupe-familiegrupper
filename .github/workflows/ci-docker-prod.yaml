name: CI - Docker Build and Test

on:
  push:
    branches:
      - "**"
      - "!main"
  pull_request:
  workflow_dispatch:

env:
  CI_IMAGE_TAG: gaupefam:ci-${{ github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{
    github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "build image"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export
        uses: docker/build-push-action@v6
        with:
          tags: ${{ env.CI_IMAGE_TAG }}
          cache-from: type=gha,scope=gaupefam
          cache-to: type=gha,mode=min,scope=gaupefam
          outputs: type=docker,dest=/tmp/gaupefam.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: gaupefam
          path: /tmp/gaupefam.tar

  test:
    name: "test image"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: gaupefam
          path: /tmp

      - name: Load image
        run: |
          docker load --input /tmp/gaupefam.tar
          docker image ls -a

      - name: Test Docker compose
        run: |
          docker compose up -d
          docker compose ps
          docker compose logs --no-color --tail=200
          if ! docker compose ps --status running | grep -q "test"; then
            echo "Expected service 'test' to be running" >&2
            exit 1
          fi
          docker compose down

      - name: Test R package runtime path
        run: |
          docker run ${{ env.CI_IMAGE_TAG }} Rscript -e 'library(gaupefam); data("lynx_family_test_data", package = "gaupefam"); dm <- gaupefam::create_distance_matrix(lynx_family_test_data$geometry); stopifnot(is.matrix(dm), nrow(dm) > 0); gaupefam::hello()'
